# Proposed F-Droid source-build recipe. Publication status: docs/fdroid.md.
Categories:
  - Science & Education
  - Translation & Dictionary
License: Apache-2.0
SourceCode: https://github.com/rummanrc/pengo
IssueTracker: https://github.com/rummanrc/pengo/issues

AutoName: Pengo

RepoType: git
Repo: https://github.com/rummanrc/pengo.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android
    gradle:
      - 'yes'
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild: python3 ../scripts/build_apk.py --assets-only

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 1
