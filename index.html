<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pengo - JLPT Kanji, Vocabulary and Grammar Study App</title>
<meta name="description" content="Learn Japanese kanji, JLPT vocabulary and JLPT grammar by level with components, mnemonics, stroke order, example sentences and SRS review."><meta name="theme-color" content="#eef6fd"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="icon" type="image/png" href="assets/pengo-icon.png"><link rel="apple-touch-icon" href="assets/pengo-icon.png"><link rel="icon" type="image/svg+xml" href="assets/icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<style>html.ob-boot .app{visibility:hidden}</style>
<script>try{if(!localStorage.getItem("pengo:onboarded:v1")){var isPrev=false;try{isPrev=new URLSearchParams(location.search).get("onboarding")==="1";}catch(e){}if(isPrev||window.KnowKanjiNative||window.Capacitor){document.documentElement.classList.add("ob-boot");}}}catch(e){}</script>
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="#/" aria-label="Pengo home">
      <img class="brand-img" src="assets/pengo-icon.png" alt="" width="34" height="34">
      <span class="brand-name">Peng<span class="peng-o">o</span></span>
    </a>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="due-pill" id="duePill" hidden></div>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">&#x1F319;</button>
    </div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <a class="brand small" href="#/"><img class="brand-img" src="assets/pengo-icon.png" alt="" width="30" height="30"><span class="brand-name">Peng<span class="peng-o">o</span></span></a>
      <form class="top-search" id="topSearch" role="search" aria-label="Quick search">
        <input type="search" id="topSearchInput" placeholder="Search" aria-label="Search" autocomplete="off">
      </form>
      <button class="theme-btn" id="themeBtn2" aria-label="Toggle dark mode">&#x1F319;</button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <footer class="footer">
      <span>Data: KANJIDIC2, KRADFILE/EDRDG, KanjiVG, Tanaka Corpus, Kanjium, JLPT vocab lists, Tatoeba sentences, Anki grammar deck (text only). See <a href="resources/CREDITS.md">credits</a>.</span>
    </footer>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
</div>
<noscript><p style="padding:2rem;text-align:center">Pengo needs JavaScript to run.</p></noscript>
<script src="platform.js"></script><script src="onboarding.js"></script><script src="course.js"></script><script src="app.js"></script>
</body>
</html>
